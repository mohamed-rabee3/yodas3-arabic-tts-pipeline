[program:yodas_ar_audit]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/yodas_ar_audit.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=1000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
